<!DOCTYPE html>
<html lang="en"> <!-- pt-br -->

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- My meta -->
	<meta name="author" content="guguzin gamer">
	<meta name="description" content="Official Guguzin Gamer's site!">

	<!-- Browser tab -->
	<link rel="icon" type="image/png" sizes="16x16" href="/assets/logo-16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-32.png">
	<link rel="icon" type="image/png" sizes="64x64" href="/assets/logo-64.png">
	<link rel="icon" type="image/png" sizes="128x128" href="/assets/logo-128.png">

	<title>Settings - Guguzin's Café</title>

	<!-- Css -->
	<link rel="stylesheet" href="/css/pages/settings.css">

	<link rel="stylesheet" href="/style.css">
</head>

<body>
	<div class="container">
		<!----------------------------------------------------------------------------------------------------->



		<main class="group"> <!-- conteúdo -->
			<h2>★ Settings</h2>

			<section id="theme" class="grid">
				<h3>Color Theme</h3>
				<p>Select your browser theme!</p>
				<fieldset action="" id="theme-field">

					<label for="sync" class="button hover">
						<div class="img st">
							<div class="st-header">
								<div class="sth-h1"></div>
								<div class="sth-nav1"></div>
								<div class="sth-nav2"></div>
								<div class="sth-note"></div>
							</div>
							<div class="st-main"></div>
							<div class="st-aside">
								<div class="sta-h2"></div>
								<div class="sta-article1"></div>
								<div class="sta-article2"></div>
							</div>
							<div class="st-footer"></div>
						</div>

						<div class="text">
							<input type="radio" name="theme" id="sync">
							<span>Sync with system</span>
						</div>
					</label>

					<label for="light" class="button hover">
						<div class="img st">
							<div class="st-header">
								<div class="sth-h1"></div>
								<div class="sth-nav1"></div>
								<div class="sth-nav2"></div>
								<div class="sth-note"></div>
							</div>
							<div class="st-main"></div>
							<div class="st-aside">
								<div class="sta-h2"></div>
								<div class="sta-article1"></div>
								<div class="sta-article2"></div>
							</div>
							<div class="st-footer"></div>
						</div>

						<div class="text">
							<input type="radio" name="theme" id="light">
							<span>Light</span>
						</div>
					</label>

					<label for="dark" class="button hover">
						<div class="img st">
							<div class="st-header">
								<div class="sth-h1"></div>
								<div class="sth-nav1"></div>
								<div class="sth-nav2"></div>
								<div class="sth-note"></div>
							</div>
							<div class="st-main"></div>
							<div class="st-aside">
								<div class="sta-h2"></div>
								<div class="sta-article1"></div>
								<div class="sta-article2"></div>
							</div>
							<div class="st-footer"></div>
						</div>

						<div class="text">
							<input type="radio" name="theme" id="dark">
							<span>Dark</span>
						</div>
					</label>

					<label for="vintage" class="button hover">
						<div class="img st">
							<div class="st-header">
								<div class="sth-h1"></div>
								<div class="sth-nav1"></div>
								<div class="sth-nav2"></div>
								<div class="sth-note"></div>
							</div>
							<div class="st-main"></div>
							<div class="st-aside">
								<div class="sta-h2"></div>
								<div class="sta-article1"></div>
								<div class="sta-article2"></div>
							</div>
							<div class="st-footer"></div>
						</div>

						<div class="text">
							<input type="radio" name="theme" id="vintage">
							<span>Vintage</span>
						</div>
					</label>

					<label for="noir" class="button hover">
						<div class="img st">
							<div class="st-header">
								<div class="sth-h1"></div>
								<div class="sth-nav1"></div>
								<div class="sth-nav2"></div>
								<div class="sth-note"></div>
							</div>
							<div class="st-main"></div>
							<div class="st-aside">
								<div class="sta-h2"></div>
								<div class="sta-article1"></div>
								<div class="sta-article2"></div>
							</div>
							<div class="st-footer"></div>
						</div>

						<div class="text">
							<input type="radio" name="theme" id="noir">
							<span>Noir</span>
						</div>
					</label>
				</fieldset>
				<small>You can suggest themes in our discord!</small>
			</section>
			
			<hr>

			<section id="sound" class="toggle">
				<div>
					<h3>Custom Sounds</h3>
					<p>Enables custom sounds/audios, like hover sfx!</p>
				</div>
				<input type="checkbox" name="sound" id="sound-toggle" checked>
			</section>

			<hr>

			<section id="reduce-motion" class="toggle">
				<div>
					<h3>Reduce Motion</h3>
					<p>Disables the smooth animations.</p>
				</div>
				<input type="checkbox" name="reduce-motion" id="reduce-motion-toggle">
			</section>
		</main>



		<!----------------------------------------------------------------------------------------------------->

		<!-- barra do topo em telas menores -->
		<header id="header-sub" class="board">
		</header>

		<!-- barra da esquerda principal -->
		<div id="wrapper-header-main"></div>

		<!-- barra da direita -->
		<div id="wrapper-aside"></div>
	</div>

	<footer id="footer" class="board"></footer>

	<!-- javascript -->
	<custom-script src="/js/pages/settings.js"></custom-script>
	<script src="/script.js"></script>
</body>
</html>
